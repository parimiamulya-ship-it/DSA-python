<!DOCTYPE html>
<html>

<head>

    <title>Booking Details - MovieBook</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Header -->

    <header>

        <h1>🎬 MovieBook</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="movies.html">Movies</a>
        </nav>

    </header>


    <section class="booking-page">

        <h2>Enter Your Details</h2>


        <div class="booking-container">

            <!-- Customer Form -->

            <div class="customer-form">

                <h3>Customer Information</h3>

                <form id="bookingForm">

                    <label>Full Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >


                    <label>Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >


                    <label>Phone Number</label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        maxlength="10"
                        required
                    >


                    <button type="submit">
                        Confirm Booking
                    </button>

                </form>

            </div>


            <!-- Booking Summary -->

            <div class="summary">

                <h3>Booking Summary</h3>

                <p>
                    Movie:
                    <strong id="movie"></strong>
                </p>

                <p>
                    Date:
                    <strong id="date"></strong>
                </p>

                <p>
                    Time:
                    <strong id="time"></strong>
                </p>

                <p>
                    Seats:
                    <strong id="seats"></strong>
                </p>

                <p>
                    Tickets:
                    <strong id="tickets"></strong>
                </p>

                <hr>

                <h3>
                    Total:
                    ₹<span id="total"></span>
                </h3>

            </div>

        </div>

    </section>


    <script>

        // Get data from localStorage

        let movie =
            localStorage.getItem("movie");

        let date =
            localStorage.getItem("showDate");

        let time =
            localStorage.getItem("showTime");

        let seats =
            JSON.parse(
                localStorage.getItem("selectedSeats")
            );

        let total =
            localStorage.getItem("totalPrice");


        // Display booking information

        document.getElementById("movie").innerText =
            movie;

        document.getElementById("date").innerText =
            date;

        document.getElementById("time").innerText =
            time;

        document.getElementById("seats").innerText =
            seats.join(", ");

        document.getElementById("tickets").innerText =
            seats.length;

        document.getElementById("total").innerText =
            total;


        // Form submission

        document.getElementById("bookingForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                let name =
                    document.getElementById("name").value;

                let email =
                    document.getElementById("email").value;

                let phone =
                    document.getElementById("phone").value;


                // Save customer details

                localStorage.setItem(
                    "customerName",
                    name
                );

                localStorage.setItem(
                    "customerEmail",
                    email
                );

                localStorage.setItem(
                    "customerPhone",
                    phone
                );


                // Go to confirmation page

                window.location.href =
                    "confirmation.html";

            });

    </script>

</body>

</html>
